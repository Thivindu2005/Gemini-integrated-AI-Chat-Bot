<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>

  <!-- Opens the connection to Google early so the first answer starts sooner -->
  <link rel="preconnect" href="https://generativelanguage.googleapis.com">

  <!-- Our styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Colourful blobs sit behind the glass. Without them the blur has nothing to blur -->
  <div class="blob blob-one"></div>
  <div class="blob blob-two"></div>
  <div class="blob blob-three"></div>

  <!-- The glass chat card -->
  <main class="chat">

    <!-- Header: bot avatar, title, online status and the menu button -->
    <header class="chat-header">
      <div class="avatar avatar-large avatar-header">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <line x1="24" y1="7" x2="24" y2="12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <circle cx="24" cy="5.5" r="2.6" fill="currentColor"/>
          <rect x="3" y="22" width="4" height="10" rx="2" fill="currentColor"/>
          <rect x="41" y="22" width="4" height="10" rx="2" fill="currentColor"/>
          <rect x="7" y="12" width="34" height="28" rx="12" fill="currentColor"/>
          <circle class="bot-eye" cx="18" cy="25" r="2.8"/>
          <circle class="bot-eye" cx="30" cy="25" r="2.8"/>
          <path class="bot-mouth" d="M20 31c2.5 2 5.5 2 8 0" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="header-text">
        <h1>AI Chatbot</h1>
        <p>Always here to help you <span class="status-dot"></span></p>
      </div>

      <!-- The three dots button clears the conversation -->
      <button type="button" id="clear-btn" class="icon-btn" title="Clear chat" aria-label="Clear chat">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="12" r="2"/>
          <circle cx="12" cy="12" r="2"/>
          <circle cx="19" cy="12" r="2"/>
        </svg>
      </button>
    </header>

    <!-- Messages are added here by script.js -->
    <section id="messages" class="messages" aria-live="polite"></section>

    <!-- Files the user picked but has not sent yet (hidden until something is attached) -->
    <div id="attachment-tray" class="attachment-tray" hidden></div>

    <!-- Input bar -->
    <form id="chat-form" class="input-bar">

      <!-- Paperclip button. It opens the hidden file picker below -->
      <button type="button" id="attach-btn" class="attach-btn" title="Attach files, photos or videos" aria-label="Attach files, photos or videos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>
        </svg>
      </button>

      <!-- The real file picker. Hidden, because the paperclip button triggers it -->
      <input type="file" id="file-input" accept="image/*,video/*,audio/*,application/pdf,text/*" multiple hidden>

      <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" autofocus>
      <button type="submit" id="send-btn" class="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2 11 13"/>
          <path d="M22 2 15 22l-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </form>

  </main>

  <!-- config.js holds the API key, so it must load before script.js -->
  <script src="js/config.js?v=7"></script>
  <script src="js/script.js?v=7"></script>
</body>
</html>
